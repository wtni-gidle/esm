# Explicit opt-in: bash run_esmfold2.sh -i input.json -o out -y configs/inference.yaml
# Present YAML values override CLI. Relative paths are relative to this file.
write_input_json: true
compress_fold_input: false
compress_full_confidence: false
skip: false
num_diffusion_samples: 5
num_diffusion_steps: 200
num_loops: 20
checkpoint: biohub/ESMFold2
# esmc_checkpoint: ../weights/ESMC-300M
dtype: auto
esmc_precision: bf16
kernel_backend: auto
include_embeddings: false
